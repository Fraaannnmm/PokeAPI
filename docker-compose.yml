services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokeapi
      POSTGRES_USER: pokeapi
      POSTGRES_PASSWORD: pokeapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeapi -d pokeapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://pokeapi:pokeapi@db:5432/pokeapi
      FRONTEND_ORIGIN: http://localhost:5173
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: "1234"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
